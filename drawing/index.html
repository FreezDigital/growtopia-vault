2 4.5 8 1.5 14 4.5 14 6 8 9 2 6Z"/><path class="iso-swatch-crease" d="M2 4.5 8 7.5 14 4.5"/></svg>Steel bin shelving, wire racks, furniture and stock, at true size from the signed-off plan</span><span class="iso-key"><svg class="iso-swatch" data-mark="edge" viewBox="0 0 16 10" aria-hidden="true"><path d="M1.5 5h13"/></svg>Brands from the Frosted Nug Carneys Point menu (Oct 2026); bin placement illustrative. Hover a card for its brand, category and menu SKUs</span></span><span class="iso-caption">The Frosted Nug product vault, about 24 by 24 feet (576 sq ft), drawn at true size from the approved floor plan (vault-plan-v3, with the client's markup: coolers facing desk 2, service window over it), with every fixture numbered as on the plan. Shelving is grey steel bin shelving: angle posts with a hole row every inch and a half, eight box shelves bolted into the angles, closed backs, end panels with X sway braces on exposed ends, hopper bins with coloured label cards, orange cards flagging the upper rows, and cases on the top shelf. Wire racks stand on grooved posts with split collars, the two rolling racks on swivel casters. The ceiling is a 2 by 4 drop grid drawn whole as a see-through lid, with nine LED troffers, three supply diffusers, a return grille, the open access hatch and the dome camera, counted from the photos; the Ceiling button lifts it off. The two walls nearest the viewer are cut at 30 inches; the service window, the TV and the literature holder on a cut wall show as faint see-through ghosts. Take apart lifts every fixture out of the room, leaving their footprints on the floor; picking one isolates it and takes it into its parts, with a parts list and assembly steps. Construction is typical, drawn from the photos and video: part counts are what is drawn, not a stock count. Bin cards, hang tags and shipping labels print brand names from the Frosted Nug Carneys Point menu (Oct 2026) as plain text in one neutral condensed face, with no logos, package art or brand lettering; each run carries one dominant category (accessories on the LOCK shelf, concentrates on the blue unit, vapes on the yellow run, edibles on the pink units and the east run's east face, flower on the green run, the east run's west face and the jar and pouch racks, pre-rolls on the island and the rolling racks, tinctures and topicals on the tag rack), and bigger brands get more bins. Brands from the Frosted Nug Carneys Point menu (Oct 2026); bin placement illustrative. Packages are generic shapes in plain accent colours.</span></figcaption></figure></main><script type="module">const AZIMUTH = 45;
const ELEVATION = 30;

const RADIANS = Math.PI / 180;

        lower.push(point);
    }

function runsOf(flags, want) {

function extrude(ring, z, height, projection, options = {}) {

function circleRing(cx, cy, radius, steps = 40) {

const insetPlan = ({ x, y, w, d, r }, by) => ({ x: x + by, y: y + by, w: w - by * 2, d: d - by * 2, r: Math.max(0, r - by) });

const planOutline = (plan, z, projection, steps = 8) => onTop(ringOf(plan, steps), z, projection, true);
